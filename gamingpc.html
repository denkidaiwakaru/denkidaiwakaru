<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーミングPCの電気代を計算｜無料ツール</title><meta name="description" content="ゲーミングPCの消費電力と使用時間から電気代を計算できます。"><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="/">電気代かんたん計算機</a><nav class="navlinks"><a href="/">計算機</a><a href="/appliances.html">家電別</a><a href="/about.html">このサイトについて</a></nav></div></header><main><section class="hero"><div class="wrap"><span class="pill">家電別計算</span><h1>ゲーミングPCの電気代</h1><p class="lead">ゲーミングPCの消費電力と使用時間から、月・年間の電気代の目安を計算できます。</p></div></section><section class="wrap"><div class="card"><h2>ゲーミングPCの電気代を計算</h2><form class="formgrid" data-electric-form><div class="field"><label>消費電力（W）</label><input name="watts" type="number" value="500" min="1" required></div><div class="field"><label>1日の使用時間（時間）</label><input name="hours" type="number" value="1" min="0" step=".1" required></div><div class="field"><label>1か月の使用日数</label><input name="days" type="number" value="30" min="1" max="31" required></div><div class="field"><label>電気料金単価（円/kWh）</label><input name="rate" type="number" value="31" min="1" step=".1" required></div></div><p><button class="btn">計算する</button></p></form><div id="result" class="result">計算結果がここに表示されます。</div><p class="note">計算値は目安です。機種・運転状態・契約条件などにより実際の料金は変わります。</p></div><div class="ad">広告掲載予定エリア</div><p><a href="/appliances.html">家電別一覧へ戻る</a></p></section><script src="/app.js"></script></main><footer class="footer"><div class="wrap"><a href="/about.html">運営情報</a><a href="/privacy.html">プライバシー</a><a href="/contact.html">お問い合わせ</a><p>※表示される電気代は入力条件に基づく目安です。実際の料金は契約プラン等により異なります。</p></div></footer></body></html>
